<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    .head {
      fill: #5a5a5a;
    }
    .neck {
      fill: #5a5a5a;
    }
    .outline {
      fill: none;
      stroke: #7cb342;
      stroke-width: 2;
      stroke-linecap: round;
    }
  </style>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#f5f5f5" />
  
  <!-- Head shape -->
  <path d="M50 15 
           C35 15, 25 30, 25 45
           C25 60, 35 70, 50 70
           C65 70, 75 60, 75 45
           C75 30, 65 15, 50 15Z" 
        class="head" />
  
  <!-- Neck shape -->
  <path d="M40 70 
           L40 85 
           L60 85 
           L60 70" 
        class="neck" />
  
  <!-- Shoulders hint -->
  <path d="M30 85 
           C30 90, 40 95, 50 95
           C60 95, 70 90, 70 85" 
        class="outline" />
</svg>
